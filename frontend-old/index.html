<!DOCTYPE html>
<html>
    <head>
        <title>Student Management System</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1 id="title">Student Management System</h1>

        <button id="changeButton">Change Title</button>

        <button id="showStudentsButton">Show Students</button>

        <div>
            <label>Name </label>
            <input id="nameInput" type="text">
        </div>

        <div>
            <label>Age</label>
            <input id="ageInput" type="number">
        </div>

        <div>
            <label>Group</label>
            <input id="groupInput" type="text">
        </div>

        <button id="addStudentButton">Add Student</button>

        <p>Welcome to our Student Management System.</p>
        
        <h2>Students</h2>

        <div id="studentsList"></div>
        <script src="script.js"></script>
    </body>
</html>
